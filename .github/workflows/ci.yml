name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run render-panda-queues unit tests
        run: python3 -m unittest discover -s tests -v

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup PanDA stack
        uses: ./
        with:
          ref: ${{ github.sha }}
          timeout: '300'
          # Override the queue-default worker image for the queue-default
          # test below: a small public image, deliberately different from
          # the per-job image used by the first integration test
          # (python:3.12-alpine), so each test proves its own path.
          env-overrides: |
            PANDA_WORKER_IMAGE=python:3.13-alpine

      - name: Verify Harvester is running
        run: |
          docker compose -f $PANDA_COMPOSE_DIR/docker-compose.yml \
            -p $PANDA_COMPOSE_PROJECT ps harvester
          docker compose -f $PANDA_COMPOSE_DIR/docker-compose.yml \
            -p $PANDA_COMPOSE_PROJECT logs harvester --tail=20

      - name: Wait for Harvester healthy
        run: |
          echo "Waiting for Harvester to become healthy (timeout 300s)..."
          DEADLINE=$((SECONDS + 300))
          STATUS="unknown"
          while [[ $SECONDS -lt $DEADLINE ]]; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              ${PANDA_COMPOSE_PROJECT}-harvester-1 2>/dev/null || echo "not_found")
            echo "  Harvester health: $STATUS"
            [[ "$STATUS" == "healthy" ]] && break
            sleep 10
          done
          if [[ "$STATUS" != "healthy" ]]; then
            docker compose -f $PANDA_COMPOSE_DIR/docker-compose.yml \
              -p $PANDA_COMPOSE_PROJECT logs harvester --tail=50
            echo "ERROR: Harvester did not become healthy within 300s (status: $STATUS)"
            exit 1
          fi
          echo "Harvester is healthy."

      - name: Verify rendered queue config (template inheritance)
        run: |
          # The harvester renders panda_queues.cfg from
          # config/harvester/panda_queues.template.json via
          # scripts/render-panda-queues.py. Concrete queues must inherit the
          # submitter block (incl. containerImage) from the shared template
          # queue through templateQueueName — this is what DockerSubmitter
          # falls back to for jobs without a per-job container_name.
          # This also checks the compose -> env -> render chain for
          # PANDA_WORKER_IMAGE up front, in seconds, instead of letting a
          # broken override surface only when the queue-default job below
          # lands in the wrong container ~4 minutes later.
          # Runs after the health wait: the file only appears once the
          # harvester entrypoint finishes its setup and renders the config.
          docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
            python3 -c "
          import json
          cfg = json.load(open('/var/lib/panda/panda_queues.cfg'))
          template = cfg['panda-compose-local.template']
          assert template['submitter']['name'] == 'DockerSubmitter', template['submitter']
          assert template['submitter']['containerImage'] == 'python:3.13-alpine', template['submitter']
          queue = cfg['PANDA_COMPOSE_LOCAL']
          assert queue['templateQueueName'] == 'panda-compose-local.template', queue
          print('rendered queue config OK; template containerImage =', template['submitter']['containerImage'])
          "

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install panda-client
        run: python -m pip install panda-client

      - name: Integration test — submit, poll, query status
        run: |
          echo "=== Submitting job ==="
          # Use --container to specify a per-job container image, mirroring PanDA's
          # production container_name field. The DockerSubmitter reads this from
          # job.jobParams["container_name"] and prefers it over the queue-level default.
          # python:3.12-alpine is deliberately different from the queue default
          # (PANDA_WORKER_IMAGE=python:3.13-alpine in this run) to prove per-job
          # container selection is working.
          JOB_ID=$(python3 $PANDA_COMPOSE_DIR/scripts/pandajob-submit \
            --site PANDA_COMPOSE_LOCAL \
            --container python:3.12-alpine \
            --transformation sh \
            --output user.alice.ci.out.txt \
            --params "-c 'echo hello from python:3.12-alpine > user.alice.ci.out.txt; python3 --version; uname -a'" \
            --name ci-integration-test)
          echo "Submitted PanDA job ID: $JOB_ID"

          if ! [[ "$JOB_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: expected integer job ID, got: $JOB_ID"
            exit 1
          fi

          echo "=== Waiting for job to reach finished/failed (timeout 20 min) ==="
          DEADLINE=$((SECONDS + 1200))
          POLL=0
          while [[ $SECONDS -lt $DEADLINE ]]; do
            STATUS_JSON=$(python3 $PANDA_COMPOSE_DIR/scripts/pandajob-status "$JOB_ID")
            JOB_STATUS=$(echo "$STATUS_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['jobStatus'])")
            echo "[$(date -u '+%H:%M:%S')] Job status: $JOB_STATUS"
            case "$JOB_STATUS" in
              finished)
                echo "OK: job reached 'finished'"
                break
                ;;
              failed|cancelled)
                echo "ERROR: job ended in terminal state '$JOB_STATUS'"
                echo "$STATUS_JSON"
                # Fall through to diagnostics before exiting
                POLL=3
                ;;
            esac

            # Dump diagnostics every 4 polls (~60 s) so stuck jobs are visible.
            POLL=$(( (POLL + 1) % 4 ))
            if [[ "$POLL" -eq 0 ]]; then
              echo "--- [diag] worker containers ---"
              docker ps -a --filter 'name=harvester-worker' \
                --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' 2>/dev/null || true
              echo "--- [diag] harvester job_fetcher log ---"
              docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
                tail -n 15 /var/log/harvester/panda-job_fetcher.log 2>/dev/null || true
              echo "--- [diag] harvester submitter log ---"
              docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
                tail -n 15 /var/log/harvester/panda-submitter.log 2>/dev/null || true
              echo "--- [diag] harvester docker_submitter log ---"
              docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
                tail -n 15 /var/log/harvester/panda-docker_submitter.log 2>/dev/null || true
              echo "--- [diag] harvester work_table ---"
              docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
                python3 -c "import sqlite3;print([r for r in sqlite3.connect('/var/lib/panda/harvester.db').execute('SELECT workerID,status,nativeStatus,substr(batchID,1,12) FROM work_table ORDER BY workerID DESC LIMIT 10')])" \
                2>/dev/null || true
              echo "--- [diag] harvester pq_table (queues loaded) ---"
              docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
                python3 -c "import sqlite3;print([r for r in sqlite3.connect('/var/lib/panda/harvester.db').execute('SELECT queueName FROM pq_table')])" \
                2>/dev/null || true
              echo "--- [diag] harvester queue_config_mapper errors ---"
              docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
                grep -E 'ERROR|WARNING' /var/log/harvester/panda-queue_config_mapper.log 2>/dev/null | tail -5 || true
              echo "---"
            fi

            [[ "$JOB_STATUS" == "failed" || "$JOB_STATUS" == "cancelled" ]] && exit 1
            sleep 15
          done

          echo "--- [diag] final harvester submitter log ---"
          docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
            tail -n 30 /var/log/harvester/panda-submitter.log 2>/dev/null || true
          echo "--- [diag] final docker_submitter log ---"
          docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
            tail -n 30 /var/log/harvester/panda-docker_submitter.log 2>/dev/null || true
          echo "--- [diag] final docker_monitor log ---"
          docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
            tail -n 30 /var/log/harvester/panda-docker_monitor.log 2>/dev/null || true
          echo "--- [diag] final worker containers ---"
          docker ps -a --filter 'name=harvester-worker' \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' 2>/dev/null || true

          if [[ "$JOB_STATUS" != "finished" ]]; then
            echo "ERROR: job did not reach 'finished' within 20 minutes (last status: $JOB_STATUS)"
            exit 1
          fi

      - name: Integration test — queue-default container image
        run: |
          echo "=== Submitting job WITHOUT --container (queue default path) ==="
          # The job above proves per-job container selection with --container.
          # This one proves the queue-level default path: no container_name in
          # the job spec, so DockerSubmitter must fall back to the
          # containerImage inherited from the queue template
          # (config/harvester/panda_queues.template.json), which for this run
          # is overridden via PANDA_WORKER_IMAGE=python:3.13-alpine — a small
          # public image, distinct from the per-job python:3.12-alpine, so
          # each test proves its own path.
          JOB_ID=$(python3 $PANDA_COMPOSE_DIR/scripts/pandajob-submit \
            --site PANDA_COMPOSE_LOCAL \
            --transformation sh \
            --output user.alice.ci.default-image.out.txt \
            --params "-c 'echo hello from queue-default image > user.alice.ci.default-image.out.txt; cat /etc/os-release | head -1'" \
            --name ci-queue-default-image-test)
          echo "Submitted PanDA job ID: $JOB_ID"
          if ! [[ "$JOB_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: expected integer job ID, got: $JOB_ID"
            exit 1
          fi

          echo "=== Waiting for job to reach finished/failed (timeout 20 min) ==="
          DEADLINE=$((SECONDS + 1200))
          while [[ $SECONDS -lt $DEADLINE ]]; do
            JOB_STATUS=$(python3 $PANDA_COMPOSE_DIR/scripts/pandajob-status "$JOB_ID" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['jobStatus'])")
            echo "[$(date -u '+%H:%M:%S')] Job status: $JOB_STATUS"
            case "$JOB_STATUS" in
              finished) break ;;
              failed|cancelled)
                echo "ERROR: job ended in terminal state '$JOB_STATUS'"
                exit 1 ;;
            esac
            sleep 15
          done
          if [[ "$JOB_STATUS" != "finished" ]]; then
            echo "ERROR: job did not reach 'finished' within 20 minutes (last status: $JOB_STATUS)"
            exit 1
          fi

          echo "=== Asserting the queue-default image was actually used ==="
          # DockerSubmitter logs which image it picked per worker; prove the
          # fallback went through the template (not a per-job override).
          # The informational grep below is a pipeline whose status is
          # tail's, so it must not be reused for the assertion: grep -q
          # fails the step when the line is missing.
          docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
            sh -c "grep 'using queue default container image=' /var/log/harvester/panda-docker_submitter.log | tail -1"
          docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
            grep -q 'using queue default container image=python:3.13-alpine' /var/log/harvester/panda-docker_submitter.log \
            || { echo "ERROR: queue-default job did not use PANDA_WORKER_IMAGE"; exit 1; }
          echo "OK: queue-default container path verified"

      - name: Verify job output landed in Rucio
        run: |
          echo "=== RSE contents ==="
          docker exec ${PANDA_COMPOSE_PROJECT}-rucio-1 \
            find /tmp/rucio_rse -type f -printf '%s\t%p\n' 2>/dev/null || true

          echo "=== DIDs in user.alice ==="
          TOKEN=$(docker exec ${PANDA_COMPOSE_PROJECT}-rucio-1 curl -s -i \
            -H 'X-Rucio-Account: root' \
            -H 'X-Rucio-Username: ddmlab' \
            -H 'X-Rucio-Password: secret' \
            http://localhost/auth/userpass \
            | grep -i '^x-rucio-auth-token:' | tr -d '\r' | awk '{print $2}')

          DIDS=$(docker exec ${PANDA_COMPOSE_PROJECT}-rucio-1 curl -s \
            -H "X-Rucio-Auth-Token: $TOKEN" \
            'http://localhost/dids/user.alice/dids/search?type=file')
          echo "$DIDS"

          if [[ -z "$DIDS" || "$DIDS" == "[]" ]]; then
            echo "ERROR: no output DIDs registered in Rucio scope user.alice"
            echo "--- stager log ---"
            docker exec ${PANDA_COMPOSE_PROJECT}-harvester-1 \
              tail -n 50 /var/log/harvester/panda-stager.log 2>/dev/null || true
            exit 1
          fi
          echo "OK: job output is registered in Rucio"

      - name: Dump all service logs
        if: always()
        env:
          PANDA_COMPOSE_DIR: ${{ env.PANDA_COMPOSE_DIR || '__panda_compose__' }}
          PANDA_COMPOSE_PROJECT: ${{ env.PANDA_COMPOSE_PROJECT || 'panda-compose' }}
        run: |
          echo "::group::docker compose ps"
          docker compose -f "$PANDA_COMPOSE_DIR/docker-compose.yml" \
            -p "$PANDA_COMPOSE_PROJECT" ps || true
          echo "::endgroup::"
          echo "::group::All service logs (tail 500 per service)"
          docker compose -f "$PANDA_COMPOSE_DIR/docker-compose.yml" \
            -p "$PANDA_COMPOSE_PROJECT" logs --tail 500 || true
          echo "::endgroup::"

      - name: Tear down PanDA stack
        if: always()
        run: |
          docker compose -f $PANDA_COMPOSE_DIR/docker-compose.yml \
            -p $PANDA_COMPOSE_PROJECT down -v
