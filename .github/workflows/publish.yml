name: Publish OCI Artifact

on:
  push:
    # Publish :latest on relevant changes to main; always publish on version tags.
    # Note: GitHub's paths filter applies to both branches and tags, so we omit it here
    # and let the workflow run on all pushes to main and all v* tags.
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare .env
        run: cp .env.example .env

      - name: Publish compose file as OCI artifact (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker compose publish --yes ghcr.io/${{ github.repository }}:latest

      - name: Publish compose file as OCI artifact (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker compose publish --yes ghcr.io/${{ github.repository }}:${{ github.ref_name }}
