# Guard file: presence of /opt/idds/config/idds/supervisord_idds.ini makes
# start-daemon.sh skip its "supervisord conf not found" branch - the block
# that would otherwise install the agent-chain supervisord programs
# (clerk, transformer, submitter, poller, receiver, trigger, finisher) from
# config_default. Their /etc/supervisord.d/*.ini symlinks then dangle and
# those programs never start.
#
# NOTE: that same skipped branch is also where start-daemon copies
# supervisord_httpd.ini, supervisord_logrotate.ini and
# supervisord_healthmonitor.ini (plus their helper scripts) - in 2.6.22
# these are NOT copied unconditionally. The entrypoint shim therefore
# restores them explicitly after suppressing the agents; without that, a
# fresh /opt/idds/config volume would have a broken /etc/supervisord.d/
# httpd.ini symlink and supervisord would start no httpd at all.
#
# The agent chain must stay off in the compose stack: create_workflow_task
# submits to PanDA synchronously, and the running carriers would act on the
# records the handler writes (observed live flipping old processings to
# Broken/Finished within minutes of boot).
#
# This file's own contents are inert: nothing symlinks it into
# /etc/supervisord.d, so supervisord never reads it - only its existence
# matters.
