# Supervisor program definition for the iDDS REST service only.
#
# The upstream image's start-daemon.sh copies the full agent-chain program
# definitions (clerk, transformer, submitter, poller, receiver, trigger,
# finisher) into /opt/idds/config/idds/ ONLY when this file is absent
# ("supervisord conf not found" branch). Mounting this file therefore
# suppresses the whole agent chain: their /etc/supervisord.d/*.ini symlinks
# dangle and supervisord starts only the programs defined by the files that
# are still copied unconditionally (httpd, healthmonitor, logrotate).
#
# The agent chain must stay off in the compose stack: create_workflow_task
# submits to PanDA synchronously, and the running carriers would act on the
# records the handler writes (e.g. the Finisher acts on ToCancel processings
# - observed live flipping old processings to Broken/Finished within minutes
# of boot) and would break the "lifecycle commands are recorded, not
# executed" contract this stack documents.
#
# Note: start-daemon.sh unconditionally starts redis and NATS regardless of
# this file; with no agents running they are unused, and supervisord will
# log the dangling nats.ini symlink as a harmless error.
[include]
files = supervisord_httpd.ini
