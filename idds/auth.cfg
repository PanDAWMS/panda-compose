# iDDS auth config for the compose stack.
#
# The stack has no grid certificates. Callers are identified by the DN that
# the wsgi middleware injects from IDDS_DEV_DN (see idds/Dockerfile): in
# production httpd terminates TLS and exports the client certificate DN as
# SSL_CLIENT_S_DN in the WSGI environ; this stack serves plain HTTP, so the
# middleware injects the dev identity for every caller instead. Read via
# IDDS_AUTH_CONFIG by idds.common.authentication - a separate file from
# idds.cfg by design.
#
# With IDDS_DEV_DN=/CN=idds/O=Dev/C=CH the entries below mean:
# - allow_users: get_user_name_from_dn('/CN=idds/O=Dev/C=CH') == 'idds',
#   so the derived username matches. Entries here are comma-separated AND
#   matched as substrings against the DN (dn.find(allow_user) > -1), so a
#   comma inside one entry would split it into three separate substring
#   checks - keep whole-DN entries comma-free.
# - super_users: matched both by username and as a DN substring. 'idds' is
#   intended to be a super user here (it is the dev identity), allowing
#   panda-server's relay to act on behalf of other users via
#   X-IDDS-Auth-Username-Original.

[common]
max_expires_in = 60

[Users]
allow_users = /CN=idds/O=Dev/C=CH
super_users = idds
