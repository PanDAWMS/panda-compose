# iDDS auth config for the compose stack.
#
# The stack has no grid certificates. Callers are identified by the DN
# configured below: the DevDNMiddleware patch on the image's idds.wsgi
# (see idds/Dockerfile) injects IDDS_DEV_DN as SSL_CLIENT_S_DN for every
# request - in production httpd instead exports the TLS client certificate
# DN at the same environ key. allow_users MUST therefore stay in sync with
# IDDS_DEV_DN in docker-compose.yml: the middleware authenticates everyone
# as that DN, and a mismatch here rejects every request.
#
# Match semantics (idds.common.authentication.authenticate_x509):
# - allow_users entries are matched as SUBSTRINGS of the raw DN
#   (dn.find(allow_user) > -1), before any username is derived. Entries
#   are also comma-separated, so a comma inside one entry would split it
#   into separate substring checks; keep whole-DN entries comma-free.
# - super_users entries are matched twice: by the username derived from
#   the DN (get_user_name_from_dn('/CN=idds/O=Dev/C=CH') == 'idds') and
#   as a DN substring. 'idds' is intended to be a super user here (it is
#   the dev identity), allowing panda-server's relay to act on behalf of
#   other users via X-IDDS-Auth-Username-Original.

[common]
max_expires_in = 60

[Users]
allow_users = /CN=idds/O=Dev/C=CH
super_users = idds
