# iDDS auth config for the compose stack.
#
# The stack has no grid certificates. Callers identify themselves via the
# SSL-CLIENT-S-DN / SSL-CLIENT-CERT headers (in production these are
# injected by the TLS-terminating proxy, which is the upstream deployment
# model; here the caller sets them directly over plain HTTP). Read via
# IDDS_AUTH_CONFIG by idds.common.authentication - a separate file from
# idds.cfg by design.

[common]
max_expires_in = 60

[Users]
# substring match against the DN
allow_users = CN=idds,O=Dev,C=CH
# users allowed to act on behalf of others (panda-server relay)
super_users = idds
