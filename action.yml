name: 'Setup PanDA'
description: >
  Start a self-contained PanDA server stack via Docker Compose.

author: 'PanDAWMS'

branding:
  icon: 'server'
  color: 'blue'

inputs:
  ref:
    description: 'Git ref (branch, tag, SHA) of PanDAWMS/panda-compose to check out'
    default: 'main'
  timeout:
    description: 'Seconds to wait for the PanDA server to become healthy'
    default: '300'
  project-name:
    description: >
      Docker Compose project name. Determines container name prefixes
      (e.g. <project-name>-panda-jedi-1). Change only if the default
      conflicts with other services on the runner.
    default: 'panda-compose'
  env-overrides:
    description: >
      Newline-separated KEY=VALUE pairs appended to the .env file before
      the stack starts. Use this to override default passwords or other
      variables consumed by the compose file or containers.
    default: ''

outputs:
  panda-url:
    description: 'HTTP URL of the PanDA REST API'
    value: 'http://localhost:25080/server/panda'
  panda-url-ssl:
    description: 'URL for SSL PanDA REST API (same as HTTP in the dev stack)'
    value: 'http://localhost:25080/server/panda'

runs:
  using: 'composite'
  steps:
    - name: Check out PanDAWMS/panda-compose
      uses: actions/checkout@v7
      with:
        repository: PanDAWMS/panda-compose
        ref: ${{ inputs.ref }}
        path: __panda_compose__

    - name: Configure environment
      shell: bash
      run: |
        cp __panda_compose__/.env.example __panda_compose__/.env
        if [[ -n "${{ inputs.env-overrides }}" ]]; then
          printf '%s\n' "${{ inputs.env-overrides }}" >> __panda_compose__/.env
        fi

    - name: Start PanDA stack
      shell: bash
      run: |
        compose() {
          docker compose \
            -f __panda_compose__/docker-compose.yml \
            -p "${{ inputs.project-name }}" "$@"
        }

        # Bring up the base services first and let Postgres complete its
        # first-run initialization in isolation. On a fresh CI volume the
        # image runs initdb + panda_db_init.sh and restarts the container
        # once (RestartCount=1); during that window it listens on the Unix
        # socket only and briefly transitions through unhealthy. Attaching
        # dependents via depends_on: service_healthy at the same time races
        # this and intermittently aborts with
        # 'dependency failed to start: container ...-postgres-1 is unhealthy'.
        compose up -d postgres activemq mariadb

        pg="${{ inputs.project-name }}-postgres-1"
        echo "Waiting for Postgres to settle into a stable healthy state..."
        stable=0
        for _ in $(seq 1 60); do
          status=$(docker inspect --format '{{.State.Health.Status}}' "$pg" 2>/dev/null || echo starting)
          restarts=$(docker inspect --format '{{.RestartCount}}' "$pg" 2>/dev/null || echo 0)
          echo "  postgres health=$status restarts=$restarts"
          if [ "$status" = healthy ]; then
            # Require two consecutive healthy reads so we don't catch it
            # right before the init restart.
            stable=$((stable + 1))
            [ "$stable" -ge 2 ] && break
          else
            stable=0
          fi
          sleep 5
        done
        if [ "$stable" -lt 2 ]; then
          echo "ERROR: Postgres did not reach a stable healthy state" >&2
          docker logs "$pg" 2>&1 | tail -n 80 || true
          exit 1
        fi

        # Postgres is stable; bring up the rest. Dependents' health
        # conditions are already satisfied, so there is no startup race.
        compose up -d

    - name: Wait for PanDA server
      shell: bash
      run: |
        if ! __panda_compose__/scripts/healthcheck.sh ${{ inputs.timeout }}; then
          echo "::group::Post-mortem: docker compose ps"
          docker compose \
            -f __panda_compose__/docker-compose.yml \
            -p ${{ inputs.project-name }} ps || true
          echo "::endgroup::"
          echo "::group::Post-mortem: all service logs"
          docker compose \
            -f __panda_compose__/docker-compose.yml \
            -p ${{ inputs.project-name }} logs --tail 500 || true
          echo "::endgroup::"
          exit 1
        fi

    - name: Export environment variables
      shell: bash
      run: |
        echo "PANDA_URL=http://localhost:25080/server/panda"         >> "$GITHUB_ENV"
        echo "PANDA_URL_SSL=http://localhost:25080/server/panda"     >> "$GITHUB_ENV"
        echo "X509_USER_PROXY=/dev/null"                             >> "$GITHUB_ENV"
        echo "PANDA_COMPOSE_PROJECT=${{ inputs.project-name }}"      >> "$GITHUB_ENV"
        echo "PANDA_COMPOSE_DIR=__panda_compose__"                   >> "$GITHUB_ENV"
