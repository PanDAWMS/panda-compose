# PanDA Compose — self-contained PanDA stack for development and CI
#
# Component dependency order:
#   postgres + activemq + mariadb  →  panda-server + panda-jedi  →  harvester
#
# Usage:
#   cp .env.example .env    # fill in secrets
#   docker compose up -d
#   ./scripts/healthcheck.sh
#
# Container images mirror those used in panda-k8s Helm charts.

services:

  # ────────────────────────────────────────────────────────────────
  # PostgreSQL — PanDA server + JEDI database
  # Image ships with the PanDA schema pre-installed.
  # ────────────────────────────────────────────────────────────────
  postgres:
    image: ghcr.io/pandawms/panda-database:latest
    restart: unless-stopped
    environment:
      # The init script (panda_db_init.sh) connects as 'postgres' superuser.
      # It creates the 'panda' role using PANDA_DB_PASSWORD.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      POSTGRES_DB: ${PANDA_DB_NAME:-panda_db}
      PANDA_DB_PASSWORD: ${PANDA_DB_PASSWORD:-panda_secret}
    volumes:
      - panda-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d ${PANDA_DB_NAME:-panda_db} -q"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ────────────────────────────────────────────────────────────────
  # ActiveMQ — message broker for PanDA server ↔ JEDI communication
  # The image CMD defaults to "sleep infinity"; override to start broker.
  # No JAAS auth in dev — default config accepts any STOMP credentials.
  # ────────────────────────────────────────────────────────────────
  activemq:
    image: ghcr.io/pandawms/panda-activemq:latest
    restart: unless-stopped
    command: ["/opt/activemq/bin/run-activemq-services"]
    environment:
      # Disable JDK 18 cgroup v2 detection bug (JDK-8281631) that crashes the JVM
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
    ports:
      - "61613:61613"   # STOMP (used by panda-server / harvester)
      - "8161:8161"     # Web console (admin)
    volumes:
      - activemq-data:/appdata/activemq
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 61613"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────────────────────
  # PanDA server + JEDI (unified image)
  # HTTP  → localhost:25080
  # HTTPS → localhost:25443
  #
  # The image CMD defaults to "sleep infinity". We mirror the k8s
  # statefulset startup pattern: copy sandbox scripts to /data/panda/,
  # run process_template.py to expand ${VAR} in *.template files,
  # then start httpd via run-panda-services.
  # ────────────────────────────────────────────────────────────────
  panda-server:
    image: ghcr.io/pandawms/panda-server:latest
    restart: unless-stopped
    command:
      - /bin/bash
      - -c
      - |
        cp /opt/panda/sandbox/* /data/panda/
        cp /opt/panda/sandbox-jedi/* /data/panda/
        chmod +x /data/panda/init-panda /data/panda/run-panda-crons /data/panda/run-panda-services /data/panda/init-jedi /data/panda/run-jedi-crons /data/panda/run-jedi-services
        mkdir -p /var/log/panda/pandacache/jedilog
        chmod -R 777 /var/log/panda/pandacache || true
        if [ -f /opt/panda/sandbox/panda_server-httpd.conf ]; then
          mv /opt/panda/etc/panda/panda_server-httpd.conf /opt/panda/etc/panda/panda_server-httpd.conf.back || true
          ln -sf /opt/panda/sandbox/panda_server-httpd.conf /opt/panda/etc/panda/panda_server-httpd.conf
        fi
        /opt/panda/bin/python /data/panda/process_template.py
        # Also process the httpd config directly since it's not a .template file
        /opt/panda/bin/python -c "import os, re; content=open('/opt/panda/sandbox/panda_server-httpd.conf').read(); [content.__setitem__('dummy', content.replace('$${'+k+'}',v)) or None for k,v in os.environ.items() if k.startswith('PANDA_SERVER_CONF_')]; open('/opt/panda/etc/panda/panda_server-httpd.conf','w').write(content)"
        # Remove stale lock files left by a previous container run (the writable
        # layer is reused across restarts so these files persist).
        rm -f $${PANDA_LOCK_DIR:-/var/run/panda}/panda_daemon.lock \
              $${PANDA_LOCK_DIR:-/var/run/panda}/panda_daemon.pid \
              $${PANDA_LOCK_DIR:-/var/run/panda}/panda_daemon.pid.lock
        /data/panda/run-panda-services
        # Start JEDI in background (same container, same pandaserver package)
        /data/panda/init-jedi
        /data/panda/run-jedi-crons &
        /etc/rc.d/init.d/panda-jedi start
        sleep infinity & wait
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    environment:
      # Database
      PANDA_DB_BACKEND: ${PANDA_DB_BACKEND:-postgres}
      PANDA_DB_HOST: ${PANDA_DB_HOST:-postgres}
      PANDA_DB_PORT: ${PANDA_DB_PORT:-5432}
      PANDA_DB_USER: ${PANDA_DB_USER:-panda}
      PANDA_DB_PASSWORD: ${PANDA_DB_PASSWORD:-panda_secret}
      PANDA_DB_NAME: ${PANDA_DB_NAME:-panda_db}
      PANDA_DB_SCHEMAPANDA: ${PANDA_DB_SCHEMAPANDA:-DOMA_PANDA}
      PANDA_DB_SCHEMAMETA: ${PANDA_DB_SCHEMAMETA:-DOMA_PANDAMETA}
      PANDA_DB_SCHEMAPANDAARCH: ${PANDA_DB_SCHEMAPANDAARCH:-DOMA_PANDAARCH}
      PANDA_DB_SCHEMAJEDI: ${PANDA_DB_SCHEMAJEDI:-DOMA_PANDA}
      PANDA_DB_SCHEMADEFT: ${PANDA_DB_SCHEMADEFT:-DOMA_DEFT}
      # Messaging
      PANDA_ACTIVEMQ_LIST: ${PANDA_ACTIVEMQ_LIST:-activemq:61613}
      PANDA_ACTIVEMQ_PASSWD_panda: ${PANDA_ACTIVEMQ_PASSWD_panda:-panda_mq_secret}
      PANDA_ACTIVEMQ_PASSWD_jedi: ${PANDA_ACTIVEMQ_PASSWD_jedi:-jedi_mq_secret}
      PANDA_URL: ${PANDA_URL:-http://localhost:80/server/panda}
      PANDA_URL_SSL: ${PANDA_URL_SSL:-http://localhost:80/server/panda}
      PANDA_API_URL: ${PANDA_API_URL:-http://localhost:80/api/v1}
      PANDA_API_URL_SSL: ${PANDA_API_URL_SSL:-http://localhost:80/api/v1}
      # Server — run as current user to avoid atlpan/zp user-switching in Docker
      PANDA_NO_ROOT: "1"
      PANDA_AUTH: ${PANDA_AUTH:-None}
      PANDA_VERIFY_HOST: "off"
      PANDA_BEHIND_REAL_LB: "1"
      PANDA_SERVER_CONF_PORT: ${PANDA_SERVER_CONF_PORT:-80}
      PANDA_SERVER_CONF_MIN_WORKERS: ${PANDA_SERVER_CONF_MIN_WORKERS:-1}
      PANDA_SERVER_CONF_MAX_WORKERS: ${PANDA_SERVER_CONF_MAX_WORKERS:-16}
      PANDA_SERVER_CONF_MAX_CONNECTIONS: ${PANDA_SERVER_CONF_MAX_CONNECTIONS:-200}
      PANDA_SERVER_CONF_THREADS_PER_CHILD: ${PANDA_SERVER_CONF_THREADS_PER_CHILD:-1}
      PANDA_SERVER_CONF_MAX_BACKLOG: ${PANDA_SERVER_CONF_MAX_BACKLOG:-511}
      PANDA_SERVER_CONF_SERVERNAME: ${PANDA_SERVER_CONF_SERVERNAME:-localhost}
      PANDA_SERVER_CONF_NUM_WSGI: ${PANDA_SERVER_CONF_NUM_WSGI:-2}
      PANDA_SERVER_CONF_NUM_WSGI_THREAD: ${PANDA_SERVER_CONF_NUM_WSGI_THREAD:-4}
      # Proxy (optional)
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      # JEDI specific
      PANDA_RUCIO_ACCOUNT: ${PANDA_RUCIO_ACCOUNT:-root}
      # Required for LiveConfigParser ${PANDA_HOME} expansion in panda_jedi.cfg
      PANDA_HOME: /opt/panda
    volumes:
      - ./config/panda/panda_common.cfg:/etc/panda/panda_common.cfg:ro
      - ./config/panda/panda_server.cfg:/etc/panda/panda_server.cfg:ro
      - ./config/panda/panda_jedi.cfg:/etc/panda/panda_jedi.cfg:ro
      - ./config/panda/cric:/etc/panda/cric:ro
      - ./config/panda/sandbox:/opt/panda/sandbox:ro
      - ./config/jedi/sandbox:/opt/panda/sandbox-jedi:ro
      - panda-server-logs:/var/log/panda
      - panda-cache:/var/cache/pandaserver
    ports:
      - "25080:80"    # HTTP — used by panda-client
      - "25443:443"   # HTTPS — used by panda-client for sandbox upload
    healthcheck:
      test: ["CMD-SHELL", "curl -sf ${PANDA_API_URL:-http://localhost:80/api/v1}/system/is_alive | grep -q \"'success': True\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ────────────────────────────────────────────────────────────────
  # MariaDB — Harvester database
  # ────────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_USER: ${HARVESTER_DB_USER:-harvester}
      MARIADB_PASSWORD: ${HARVESTER_DB_PASSWORD:-harvester_secret}
      MARIADB_DATABASE: ${HARVESTER_DB_NAME:-harvester_db}
      MARIADB_ROOT_PASSWORD: ${HARVESTER_DB_PASSWORD:-harvester_secret}
    volumes:
      - harvester-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u${HARVESTER_DB_USER:-harvester} -p${HARVESTER_DB_PASSWORD:-harvester_secret} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────────────────────
  # Init — one-shot service that registers PANDA_COMPOSE_LOCAL in
  # the PanDA server schedconfig so JEDI can route jobs to it.
  # ────────────────────────────────────────────────────────────────
  init:
    image: postgres:15
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    command:
      - /bin/bash
      - /scripts/setup-queue.sh
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      PGDATABASE: ${PANDA_DB_NAME:-panda_db}
      PANDA_DB_USER: panda
      PANDA_DB_PASSWORD: ${PANDA_DB_PASSWORD:-panda_secret}

  # ────────────────────────────────────────────────────────────────
  # Harvester — resource-facing pilot submission service.
  # Runs subprocess_submitter / subprocess_monitor plugins (mounted
  # from ./scripts/) so jobs execute as local subprocesses with no
  # external batch system required.
  # ────────────────────────────────────────────────────────────────
  harvester:
    image: ghcr.io/hsf/harvester:latest
    restart: unless-stopped
    command:
      - /bin/bash
      - -c
      - |
        dnf install -y python3.11 python3.11-libs python3.11-devel sqlite-devel
        cp /usr/lib64/python3.11/lib-dynload/_sqlite3.cpython-311-x86_64-linux-gnu.so /usr/local/lib/python3.11/lib-dynload/
        python3.11 -m pip install -q 'docker==7.1.0' 'rucio-clients' 'apsw'
        mkdir -p /var/log/harvester /var/run/panda /harvester/workers /var/lib/panda
        # exec preserves this shell's PID, so record it for the healthcheck
        # (PYTHONPATH is already supplied via the environment: block below).
        echo $$$$ > /var/run/panda/panda_harvester.pid
        exec /usr/local/bin/python3.11 -u -m pandaharvester.harvesterbody.master --foreground
    depends_on:
      panda-server:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      rucio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(cat /var/run/panda/panda_harvester.pid 2>/dev/null) 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    environment:
      VIRTUAL_ENV: /opt/harvester
      SITE_PACKAGES_PATH: /opt/harvester/lib/python3.11/site-packages
      PYTHONPATH: "/opt/harvester/lib/python3.11/site-packages:/harvester/plugins:/opt/harvester/lib/python3.11/site-packages/pandacommon:/usr/local/lib/python3.11/site-packages"
      PANDA_URL: ${PANDA_URL:-http://panda-server:80/server/panda}
      PANDA_URL_SSL: ${PANDA_URL_SSL:-http://panda-server:80/server/panda}
      PANDA_AUTH: "None"
      PANDA_VERIFY_HOST: "off"
      HARVESTER_DB_USER: ${HARVESTER_DB_USER:-harvester}
      HARVESTER_DB_PASSWORD: ${HARVESTER_DB_PASSWORD:-harvester_secret}
      HARVESTER_DB_NAME: ${HARVESTER_DB_NAME:-harvester_db}
      HARVESTER_DB_HOST: mariadb
      HARVESTER_EXPERIMENT: ${HARVESTER_EXPERIMENT:-wlcg}
      RUCIO_HOME: /opt/rucio
      RUCIO_CONFIG: /opt/rucio/etc/rucio.cfg
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
    volumes:
      - ./config/harvester/panda_harvester.cfg:/etc/panda/panda_harvester.cfg:ro
      - ./config/harvester/panda_common.cfg:/etc/panda/panda_common.cfg:ro
      - ./config/harvester/panda_queues.cfg:/etc/panda/panda_queues.cfg:ro
      - ./scripts/subprocess_submitter.py:/harvester/plugins/subprocess_submitter.py:ro
      - ./scripts/subprocess_monitor.py:/harvester/plugins/subprocess_monitor.py:ro
      - ./config/harvester/plugins/docker_submitter.py:/harvester/plugins/docker_submitter.py:ro
      - ./config/harvester/plugins/docker_monitor.py:/harvester/plugins/docker_monitor.py:ro
      - ./config/harvester/plugins/rucio_stager.py:/harvester/plugins/rucio_stager.py:ro
      - ./scripts/panda-worker.sh:/harvester/panda-worker.sh:ro
      - ./config/rucio/rucio-ci.cfg:/opt/rucio/etc/rucio.cfg:ro
      - rucio-rse-data:/tmp/rucio_rse
      # Must be a host bind, not a named volume. DockerSubmitter asks the
      # host daemon to bind-mount <outputBaseDir>/worker-N into each worker,
      # and the daemon resolves that path on the HOST. With a named volume
      # the worker writes to the host path while harvester reads the volume,
      # so the stager sees an empty directory and every job fails to stage.
      - /tmp/harvester_output:/tmp/harvester_output
      - /var/run/docker.sock:/var/run/docker.sock
      - harvester-logs:/var/log/harvester
      - harvester-workdir:/harvester

  # ────────────────────────────────────────────────────────────────
  # Rucio — data management. Provides the MOCK-POSIX RSE that the
  # Harvester RucioStager plugin uploads job output to.
  #
  # Runs HTTP-only (RUCIO_ENABLE_SSL=False), so no CA or host
  # certificates are needed. scripts/bootstrap-rucio.sh creates the
  # RSE, its posix protocol, the scopes and the account quota once the
  # server is healthy — rucio-init only creates the schema and the
  # 'root' account.
  # ────────────────────────────────────────────────────────────────
  ruciodb:
    image: docker.io/postgres:14
    environment:
      POSTGRES_USER: ${RUCIO_DB_USER:-rucio}
      POSTGRES_DB: ${RUCIO_DB_NAME:-rucio}
      POSTGRES_PASSWORD: ${RUCIO_DB_PASSWORD:-secret}
    command: ["-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUCIO_DB_USER:-rucio} -d ${RUCIO_DB_NAME:-rucio} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rucio-init:
    image: docker.io/rucio/rucio-init:${RUCIO_TAG:-latest}
    depends_on:
      ruciodb:
        condition: service_healthy
    environment:
      # The image ships psycopg3, not psycopg2, so the driver must be
      # named explicitly or SQLAlchemy fails with ModuleNotFoundError.
      RUCIO_CFG_DATABASE_DEFAULT: postgresql+psycopg://${RUCIO_DB_USER:-rucio}:${RUCIO_DB_PASSWORD:-secret}@ruciodb/${RUCIO_DB_NAME:-rucio}
      RUCIO_CFG_BOOTSTRAP_USERPASS_IDENTITY: ${RUCIO_USERNAME:-ddmlab}
      RUCIO_CFG_BOOTSTRAP_USERPASS_PWD: ${RUCIO_PASSWORD:-secret}
    # The upstream entrypoint runs `alembic init`, which aborts once the
    # migrate_repo directory exists. That makes a second run fail and, via
    # service_completed_successfully, block every warm `docker compose up`.
    # Skip when the schema is already present so re-ups are no-ops.
    entrypoint:
      - /bin/bash
      - -c
      - |
        if python3 -c "
        import sys, sqlalchemy
        url = '$${RUCIO_CFG_DATABASE_DEFAULT}'
        insp = sqlalchemy.inspect(sqlalchemy.create_engine(url))
        sys.exit(0 if insp.has_table('accounts') else 1)
        " 2>/dev/null; then
          echo "Rucio schema already present; skipping init."
          exit 0
        fi
        exec /docker-entrypoint.sh

  rucio:
    image: docker.io/rucio/rucio-server:${RUCIO_TAG:-latest}
    depends_on:
      rucio-init:
        condition: service_completed_successfully
    environment:
      RUCIO_ENABLE_SSL: "False"
      RUCIO_CFG_DATABASE_DEFAULT: postgresql+psycopg://${RUCIO_DB_USER:-rucio}:${RUCIO_DB_PASSWORD:-secret}@ruciodb/${RUCIO_DB_NAME:-rucio}
      # 'ping' is not in the default endpoint list, and the healthcheck
      # below uses it.
      RUCIO_CFG_API_ENDPOINTS: accounts,dids,rses,scopes,replicas,auth,config,credentials,identities,meta_conventions,rules,subscriptions,ping
    volumes:
      - rucio-rse-data:/tmp/rucio_rse
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  panda-db-data:
  panda-server-logs:
  panda-cache:
  activemq-data:
  harvester-db-data:
  harvester-logs:
  harvester-workdir:
  rucio-rse-data:
